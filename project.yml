name: LifeDashboard
options:
  bundleIdPrefix: uk.co.daniyalzia
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  LifeDashboard:
    type: application
    platform: iOS
    sources:
      - path: LifeDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.daniyalzia.LifeDashboard
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: LifeDashboard/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: "The Grid"
        NSCalendarsFullAccessUsageDescription: "The Grid reads your calendars to show today's agenda."
        NSFaceIDUsageDescription: "The Grid uses Face ID to keep your boards locked, since they can hold sensitive info."
        NSUbiquitousContainers:
          iCloud.uk.co.daniyalzia.LifeDashboard:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: One
            NSUbiquitousContainerName: "The Grid"
        CFBundleURLTypes:
          - CFBundleURLName: uk.co.daniyalzia.LifeDashboard.deeplink
            CFBundleURLSchemes:
              - lifedashboard
    entitlements:
      path: LifeDashboard/LifeDashboard.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.uk.co.daniyalzia.LifeDashboard
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.uk.co.daniyalzia.LifeDashboard
        com.apple.security.application-groups:
          - group.uk.co.daniyalzia.LifeDashboard
    dependencies:
      - target: LifeDashboardWidgetExtension
        embed: true

  LifeDashboardWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LifeDashboardWidget
      - path: LifeDashboard/Models/Board.swift
      - path: LifeDashboard/Models/BoardItem.swift
      - path: LifeDashboard/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.daniyalzia.LifeDashboard.Widget
        PRODUCT_NAME: LifeDashboardWidget
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: LifeDashboardWidget/Info.plist
      properties:
        CFBundleDisplayName: "The Grid"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LifeDashboardWidget/LifeDashboardWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uk.co.daniyalzia.LifeDashboard
